#
# Pure-Go CI: everything builds and tests with CGO_ENABLED=0 (no C toolchain).
# The `test` job builds, vets and tests natively and enforces a ratchet coverage
# gate on the pure-logic packages (css/layout/paint/dom). The `cross-build` job
# cross-compiles the whole module for all six of Go's 64-bit targets to keep the
# engine portable; it is build-only because the runtime tests need live network
# and real fonts, which are not reproducible under qemu.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CGO_ENABLED: "0"
  # ⛔ KEEP THIS EQUAL TO go.mod's `go` DIRECTIVE. It is the toolchain the
  # artefacts are built with, and the standard library is judged by it: on
  # 2026-10-31 this said 1.27.2 while GO-2026-6809 (crypto/x509
  # Certificate.Verify, reachable from cmd/render) was unfixed, fixed in
  # go1.27.3. Raising go.mod alone would leave this lane building the
  # vulnerable toolchain.
  GO_VERSION: "1.27.3"

jobs:
  test:
    name: build · vet · test · coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Build (CGO_ENABLED=0)
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # -short skips the live-network TestLiveRender; the offline golden-PNG and
      # data:-URI image paths still run. All pure-logic packages run in full.
      - name: Test
        run: go test -short ./...

      - name: Coverage gate (ratchet floors on pure-logic packages)
        run: bash scripts/coverage-gate.sh

  # The lighter builds a host can choose: without JavaScript
  # (webengine_nojs), without network (webengine_nonet), without embedded
  # fonts (webengine_fontsext), and all three, for js/wasm too (go-slides'
  # export worker). The full suite needs scripts and loopback servers; under
  # the tags the tests of what they keep run.
  tags:
    name: tags ${{ matrix.tags }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tags: ["webengine_nojs", "webengine_nonet", "webengine_fontsext", "webengine_nojs webengine_nonet webengine_fontsext"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Build and vet
        run: |
          go build -tags "${{ matrix.tags }}" . ./paint/...
          go vet -tags "${{ matrix.tags }}" . ./paint/...

      - name: Build for js/wasm
        env:
          GOOS: js
          GOARCH: wasm
        run: go build -tags "${{ matrix.tags }}" .

      - name: Test what the tags keep
        run: |
          go test -short -tags "${{ matrix.tags }}" -run 'Adjust|Geometry|JSNumbers|NoNetwork|LazyFontFace|Fetcher' .
          go test -short -tags "${{ matrix.tags }}" ./paint/...

  # The nested bench module (chromedp-based, kept out of the main module's
  # CGO=0/6-arch build and coverage gate — see bench/go.mod's own comment)
  # had no lane of its own at all. Found 2026-10-31 by a vulnerability sweep
  # that could only read HALF of this repository's dependency graph because
  # bench/go.mod had drifted stale against the parent module's `replace`
  # target (Renovate updates the parent module and has no reason to touch a
  # nested one it does not itself declare). `go vet`, not `go test`: bench's
  # own benchmarks are a `main`, and running them measures whatever shared
  # runner CI happens to land on, not this repository's code — the question
  # this job asks is only "does it still compile against the current
  # parent." No `-mod=mod`: that flag lets the command WRITE the go.mod it
  # needs, which would hide the very staleness this job exists to catch.
  bench:
    name: bench module compiles against current engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Vet (go.mod must already be tidy — no -mod=mod)
        working-directory: bench
        run: go vet ./...

  cross-build:
    name: cross-build ${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64, riscv64, loong64, ppc64le, s390x]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Build for linux/${{ matrix.goarch }}
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: go build ./...
